name: AKS Deployment Pipeline

on:
  push:
    branches:
      - aks-deployment

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Build Image in ACR
      run: |
        az acr build \
          --registry acrnileshdev \
          --image techstore:${{ github.sha }} .

    - name: Get AKS Credentials
      run: |
        az aks get-credentials \
          --resource-group AKS-Nilesh \
          --name aks-dev-nilesh-si \
          --overwrite-existing

    - name: Update Deployment Image
      run: |
        kubectl set image deployment/techstore-app \
        techstore-container=acrnileshdev.azurecr.io/techstore:${{ github.sha }}

    - name: Verify Deployment
      run: |
        kubectl rollout status deployment/techstore-app
